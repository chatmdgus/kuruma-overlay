<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Kuruma Overlay 설정</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <section>
      <h2>모니터</h2>
      <div class="grid2">
        <label>메인 모니터 <span class="hint">게임 쪽</span>
          <select id="mon-main"></select>
        </label>
        <label>서브 모니터 <span class="hint">유튜브 쪽</span>
          <select id="mon-sub"></select>
        </label>
      </div>
    </section>

    <section>
      <h2>배치</h2>
      <p class="hint">상자를 끌어서 옮기고, 오른쪽 아래 모서리로 크기를 조절함. 다른 모니터로 끌어 놓으면 그 모니터로 이동함. 실제 화면에도 바로 반영됨.</p>
      <div id="stage" class="stage"></div>
      <div class="toggles">
        <label><input type="checkbox" id="en-chat"> 채팅</label>
        <label><input type="checkbox" id="en-media"> 미디어</label>
        <label><input type="checkbox" id="en-voice"> 음성</label>
        <button id="reset" type="button" class="ghost">기본 배치로</button>
      </div>
    </section>

    <section>
      <h2>표시</h2>
      <div class="grid2">
        <label>채팅 사라지는 시간
          <select id="chat-fade">
            <option value="5">5초</option>
            <option value="10">10초</option>
            <option value="15">15초</option>
            <option value="0">사라지지 않음</option>
          </select>
        </label>
        <label>채팅 최대 줄 수
          <input type="number" id="chat-lines" min="1" max="15" step="1">
        </label>
        <label>미디어 사라지는 시간 <output id="media-fade-out"></output>
          <input type="range" id="media-fade" min="5" max="10" step="1">
        </label>
        <label>입력 모드 단축키
          <input type="text" id="hotkey" readonly>
        </label>
      </div>
    </section>
  </main>

  <footer>
    <span id="status" class="hint"></span>
    <button id="cancel" type="button" class="ghost">취소</button>
    <button id="save" type="button" class="primary">저장</button>
  </footer>
  <script src="settings.js"></script>
</body>
</html>
